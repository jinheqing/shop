# ============================================================
# Frontend 内部 nginx — 仅处理两个 SPA 的 try_files fallback
# 外部流量由上层 tea-nginx 统一反代
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    # --- Public Site SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Admin Dashboard SPA ---
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 健康检查
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
