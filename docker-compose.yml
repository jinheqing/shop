# ============================================================================
# 🍵 UK Tea House — 一键 Docker Compose 部署 (10 个服务)
#
# ── 两种部署模式 ──────────────────────────────────────────────────────────────
#
#   🔧 开发模式 (本地 build):
#     ./up.sh start          # 自动 build 所有镜像 + 启动
#     ./up.sh rebuild        # 改了代码后只 rebuild 三个自有服务
#
#   🚀 生产模式 (从 GHCR 拉预构建镜像):
#     1) docker login ghcr.io -u <your-github-user> -p $GITHUB_PAT
#     2) 确保 .env 里 IMAGE_TAG 已设置
#     3) docker compose pull && docker compose up -d --no-build
#
# ── 端口暴露（localhost） ─────────────────────────────────────────────────────
#   80    → Nginx 反代 (public-site + admin + API + WS)
#   443   → Nginx HTTPS (需配证书)
#   1935  → MediaMTX RTMP (OBS 推流)
#   7880  → LiveKit SFU (WebRTC 信令)
#   8889  → MediaMTX WebRTC
#   8090  → tea-translate (ASR + 翻译)
#   5432  → PostgreSQL (业务库)
#   5433  → PostgreSQL (审计库)
#   6379  → Redis
#   5672  → RabbitMQ
#
# ── 访问路径 ─────────────────────────────────────────────────────────────────
#   http://localhost/              公共站点
#   http://localhost/admin/        管理后台
#   http://localhost:8090/healthz  翻译服务健康检查
# ============================================================================

services:
  # ===================== ① PostgreSQL 业务库 =====================
  postgres:
    image: postgres:16-alpine
    container_name: tea-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-tea_system}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_dev}
      POSTGRES_DB: ${DB_NAME:-tea_system}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tea_system}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ② PostgreSQL 审计库 =====================
  postgres_audit:
    image: postgres:16-alpine
    container_name: tea-postgres-audit
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-tea_audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-changeme_audit_dev}
      POSTGRES_DB: ${AUDIT_DB_NAME:-tea_audit}
    ports: ["5433:5432"]
    volumes: [pg_audit_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER:-tea_audit}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ③ Redis 7 =====================
  redis:
    image: redis:7-alpine
    container_name: tea-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ④ RabbitMQ =====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tea-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理界面 http://localhost:15672
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑤ tea-translate (ASR + 翻译) =====================
  # 首次启动 Whisper + NLLB-200 预下载 ~2GB，后续用 volume 缓存
  translate:
    build:
      context: ./tea-translate
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${OWNER:-jinheqing}/shop-translate:${IMAGE_TAG:-latest}
    container_name: tea-translate
    ports: ["8090:8090"]
    environment:
      TRANSFORMERS_CACHE: /app/models
      HF_HOME: /app/models
      WHISPER_DEVICE: cpu
    volumes:
      - translate_models:/app/models
    # 模型下载慢 — 设较长的启动等待
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑥ MediaMTX (RTMP → WebRTC) =====================
  mediamtx:
    image: bluenviron/mediamtx:1.9.1
    container_name: tea-mediamtx
    ports:
      - "1935:1935"         # RTMP (OBS 推流)
      - "8889:8889"         # WebRTC HTTP
      - "8889:8889/udp"
      - "8189:8189/udp"     # WebRTC ICE fallback
      - "8888:8888"         # HLS + 管理 API
    volumes:
      - ./tea-system/docker/mediamtx.yaml:/etc/mediamtx/mediamtx.yaml:ro
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑦ LiveKit SFU (WebRTC) =====================
  livekit:
    image: livekit/livekit:v1.7.3
    container_name: tea-livekit
    ports:
      - "7880:7880"
      - "7882:7882/udp"
      - "7882:7882"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-dev-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-secret}
    volumes:
      - ./tea-system/docker/livekit.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑧ Go Backend =====================
  gin:
    build:
      context: ./tea-system
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${OWNER:-jinheqing}/shop-gin:${IMAGE_TAG:-latest}
    container_name: tea-gin
    environment:
      # ---- 业务 DB ----
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tea_system}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_dev}
      DB_NAME: ${DB_NAME:-tea_system}
      # ---- 审计 DB ----
      AUDIT_DB_HOST: postgres_audit
      AUDIT_DB_PORT: 5432
      AUDIT_DB_USER: ${AUDIT_DB_USER:-tea_audit}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-changeme_audit_dev}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-tea_audit}
      # ---- Redis / MQ ----
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      # ---- JWT ----
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please-64chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      # ---- LiveKit ----
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-dev-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-secret}
      # ---- MediaMTX ----
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_RTMP_PORT: "1935"
      # ---- Translate ----
      TRANSLATE_SERVICE_URL: http://translate:8090
      # ---- Server ----
      SERVER_ADDR: ":8080"
      GIN_MODE: release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:      { condition: service_healthy }
      postgres_audit:{ condition: service_healthy }
      redis:         { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      translate:     { condition: service_started }
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑨ 前端静态文件 (多阶段 build → nginx) =====================
  frontend:
    build:
      context: ./tea-frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${OWNER:-jinheqing}/shop-frontend:${IMAGE_TAG:-latest}
    container_name: tea-frontend
    # 不直接暴露 — 由 tea-nginx 反代统一对外
    expose: ["80"]
    volumes:
      # 内部 nginx 配置 — 处理 / 和 /admin/ 两个 SPA 的 try_files fallback
      - ./tea-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [tea-net]

  # ===================== ⑩ Nginx 反代 (统一入口) =====================
  nginx:
    image: nginx:1.27-alpine
    container_name: tea-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gin
      - frontend
      - translate
    restart: unless-stopped
    networks: [tea-net]

# ===================== Volumes =====================
volumes:
  pg_data:
  pg_audit_data:
  redis_data:
  rabbitmq_data:
  translate_models:   # Whisper base + NLLB-200 模型缓存 (~2GB)

# ===================== Network =====================
networks:
  tea-net:
    driver: bridge
