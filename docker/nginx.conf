# ==========================================================================
# Nginx 反代 — 单容器承载 前端静态 + Go API + IM WebSocket + Translate
# 路径:
#   /                → public-site (SPA, try_files fallback)
#   /admin/          → admin-dashboard (SPA)
#   /api/* /webhooks/* → Go Backend :8080
#   /ws/*            → Go IM WebSocket :8080
#   /translate/*     → tea-translate :8090 (HTTP + WS)
# 实时视频流不走 Nginx — LiveKit SDK 直连 WSS endpoint
# ==========================================================================

upstream tea_backend   { server gin:8080; }
upstream tea_translate { server translate:8090; }
upstream tea_frontend  { server frontend:80; }

server {
    listen 80 default_server;
    server_name _;

    # --- Public Site (SPA) — proxy 到 frontend 容器 ---
    location / {
        proxy_pass http://tea_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长缓存 hash 文件，短缓存 index.html
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://tea_frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- Admin Dashboard (SPA) ---
    location /admin/ {
        proxy_pass http://tea_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # --- Go Backend REST + Webhook ---
    location /api/ {
        proxy_pass http://tea_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /webhooks/ {
        proxy_pass http://tea_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --- IM WebSocket (Go Hub) ---
    location /ws/ {
        proxy_pass http://tea_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
    }

    # --- Translate HTTP + WebSocket ---
    location /translate/ {
        proxy_pass http://tea_translate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        client_max_body_size        10m;
    }
}
