# ==========================================================================
# Nginx 反代 — 单容器承载 前端静态 + Go API + IM WebSocket + Translate
# 路径:
#   /              → public-site (SPA, try_files fallback 由 frontend 容器内部处理)
#   /admin/        → admin-dashboard (SPA)
#   /s/            → Go 后端 (短链 302 重定向，不能被 SPA fallback 吃掉!)
#   /healthz       → nginx 自己的健康检查
#   /api/          → Go Backend :8080 (REST 全部在 /api/v1/* 下)
#   /ws/           → Go IM WebSocket :8080
#   /translate/    → tea-translate :8090 (HTTP + WS)
# 实时视频流不走 Nginx — LiveKit SDK 直连 WSS endpoint
#
# Nginx 匹配规则: 精确 > 最长前缀 > 正则
# 所以 /s/, /api/, /ws/ 等都不会被 location / SPA fallback 吃掉
# ==========================================================================

upstream tea_backend   { server gin:8080; }
upstream tea_translate { server translate:8090; }
upstream tea_frontend  { server frontend:80; }

server {
    listen 80 default_server;
    server_name _;

    # ── 健康检查（nginx 自己）──
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── 短链 → Go 后端 (必须在 location / 之前!) ──
    # gin 路由: engine.GET("/s/:code", r.h.ShortLink.Redirect) → 302
    # 如果被 location / 吃掉就会走 SPA fallback → 用户扫 QR 码看到首页
    location /s/ {
        proxy_pass http://tea_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Go Backend REST API ──
    # gin 路由组: engine.Group("/api/v1") + 所有 API 都在这个组下
    # proxy_pass 无 trailing slash → 完整 URI 原样转发
    # 浏览器 /api/v1/users → gin /api/v1/users → ✅ 匹配
    location /api/ {
        proxy_pass http://tea_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # ── IM WebSocket (Go Hub) ──
    # gin 路由: engine.GET("/ws/im", r.h.IMWS.Serve)
    location /ws/ {
        proxy_pass http://tea_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
    }

    # ── Translate HTTP + WebSocket ──
    location /translate/ {
        proxy_pass http://tea_translate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        client_max_body_size        10m;
    }

    # ── Admin Dashboard (SPA) ──
    location /admin/ {
        proxy_pass http://tea_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Public Site (SPA catch-all) ──
    location / {
        proxy_pass http://tea_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长缓存 hash 文件，短缓存 index.html
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://tea_frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
