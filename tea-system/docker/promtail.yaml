# ============================================================================
# Promtail — 采集所有容器日志 → Loki → Grafana
# ============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------- 所有 Docker 容器日志 ----------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 容器名 → label
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # 镜像名 → label
      - source_labels: [__meta_docker_image]
        target_label: image
      # 只有我们的容器
      - source_labels: [container]
        regex: 'tea-system-(.*)'
        target_label: app
