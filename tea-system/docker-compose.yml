# 基础设施服务编排（Step 3 再完整配置，当前骨架）
version: '3.8'

services:
  # ============ 数据库 ============
  postgres:
    image: postgres:16
    container_name: tea-system-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-tea_system}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-tea_system}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres_audit:
    image: postgres:16
    container_name: tea-system-postgres-audit
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-tea_system}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${AUDIT_DB_NAME:-tea_system_audit}
    ports:
      - "5433:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ============ 缓存 & 消息队列 ============
  redis:
    image: redis:7-alpine
    container_name: tea-system-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tea-system-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # ============ 翻译引擎 ============
  fastapi-translate:
    build:
      context: ../tea-translate
      dockerfile: Dockerfile
    container_name: tea-system-translate
    ports:
      - "8090:8090"
    restart: unless-stopped

  # ============ LiveKit + MediaMTX ============
  livekit:
    image: livekit/livekit:latest
    container_name: tea-system-livekit
    ports:
      - "7880:7880"
      - "7882:7882"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit/livekit.yaml
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: tea-system-mediamtx
    ports:
      - "1935:1935"   # RTMP
      - "8889:8889"   # WebRTC HTTP
      - "8189:8189"   # WebRTC ICE
    volumes:
      - ./docker/mediamtx.yaml:/etc/mediamtx/mediamtx.yaml
    restart: unless-stopped

  # ============ Go 后端 ============
  gin-backend:
    build: .
    container_name: tea-system-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  # ============ 监控 ============
  prometheus:
    image: prom/prometheus:latest
    container_name: tea-system-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tea-system-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: tea-system-loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: tea-system-promtail
    volumes:
      - ./docker/promtail.yaml:/etc/promtail/promtail.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pg_data:
  pg_audit_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
